name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; the job only writes to the Pages artefact, never to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel a deploy that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `base: './'` in vite.docs.config.ts keeps every asset URL relative, so
      # the same build works at a user site and at /<repo>/ on project Pages.
      #
      # Order matters: build:docs empties `site/`, build:site writes `site/vue`.
      # Run them the other way round and the Vue site disappears.
      - name: Build site
        run: npm run build:docs && npm run build:site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
