<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cesium Design System — Precision interfaces for planetary-scale data</title>
    <meta
      name="description"
      content="Cesium Design System: design tokens, React components and patterns for dense, geospatial and data-heavy interfaces."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- The two faces that paint above the fold. Preloading starts them in
         parallel with the bundle instead of after the CSS is parsed; the mono
         face and the serif italic are only used below the fold. -->
    <link
      rel="preload"
      href="./fonts/instrument-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/newsreader-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Display — editorial serif, optical size axis 6–72.
         The weight axis is narrowed to 400–500: the system only ever draws
         display type at regular or medium (never bold), and the full 200–800
         axis cost 44 kB of the 88 kB file. The opsz axis is intact, so
         `font-optical-sizing: auto` still picks the display cut. */
      @font-face {
        font-family: 'Newsreader';
        font-style: normal;
        font-weight: 400 500;
        font-display: swap;
        src: url('./fonts/newsreader-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Newsreader';
        font-style: italic;
        font-weight: 200 800;
        font-display: swap;
        src: url('./fonts/newsreader-italic-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Interface — grotesque with a warm, slightly wide voice. */
      @font-face {
        font-family: 'Instrument Sans';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('./fonts/instrument-sans-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: url('./fonts/jetbrains-mono-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      html {
        background: #08090a;
      }
      html[data-theme='light'] {
        background: #f3f4f5;
      }
    </style>
    <script>
      /* Restore theme + shape preset before first paint. */
      try {
        var t = localStorage.getItem('cesium-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        if (localStorage.getItem('cesium-style') === 'plus') {
          document.documentElement.dataset.style = 'plus';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
